<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG AI Assistant</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter&display=swap" rel="stylesheet">
</head>
<body>

<div class="ai-container">
  <div class="ai-header">
    <h1>RAG · AI CORE</h1>
    <p>Retrieval Augmented Intelligence</p>
  </div>

  <div class="chat-window" id="chatWindow">
    <div class="ai-message">
      🤖 System online. Ask your question.
    </div>
  </div>

  <div class="input-area">
    <input id="question" type="text" placeholder="Ask the AI..." />
    <button onclick="askAI()">ASK</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
